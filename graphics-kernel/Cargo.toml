[package]
name = "portal-graphics-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
utils = { workspace = true }
shader-preprocessor = { workspace = true }

wgpu = { version = "26.0.1" }
winit = { version = "0.30.11" }
pollster = "0.4.0"
derive_more = { version = "2.0.1", features = ["from", "into"] }
bon = "3.6.5"
bytemuck = "1.23.1"
glam = { version = "0.30.4", features = ["bytemuck"] }
crevice = { version = "0.18.0", features = ["glam"] }
